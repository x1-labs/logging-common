version: 2

updates:
  # `bun`, not `npm`. The repo installs from bun.lock and CI runs
  # `bun install --frozen-lockfile`; the npm ecosystem would edit
  # package.json without touching bun.lock, so every PR would fail the
  # frozen-lockfile check.
  #
  # One entry at `/` covers the workspace: Dependabot resolves the root
  # bun.lock, which is where every packages/* dependency is pinned.
  # Per-package entries would open duplicate PRs against the same lock.
  #
  # The adapters' peerDependencies (express, @nestjs/common, nestjs-pino,
  # and the optional pino-pretty) are not managed here. Those ranges are
  # deliberately wide -- "^4.0.0 || ^5.0.0" -- and replacing one rather than
  # adding to it breaks every consumer on the old major, so they stay a
  # manual edit. Dependabot bumps the same packages as root devDependencies,
  # which is how a new framework version shows up for testing.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Tooling churns fastest and carries the least risk -- eslint,
      # prettier, typescript, and the @types/* packages never ship in the
      # published artifacts. Batching keeps them to one reviewable PR.
      #
      # Restricted to minor and patch on purpose. Without this, the group
      # swept four majors into a single PR (typescript 5->7, eslint 9->10,
      # @eslint/js 9->10, @types/node 22->26) which failed outright, since
      # typescript-eslint does not support TS 7 yet. A major needs its own
      # PR and a changelog read; batching one is how it gets rubber-stamped.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # pino and its transports are the actual runtime surface. Grouped
      # only for minor/patch; a major arrives as its own PR because it can
      # change log output, which is a breaking change for consumers.
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Covers .github/workflows/ and, if one is ever added, .github/actions/.
  # Actions here are pinned to full commit SHAs with a trailing version
  # comment; Dependabot updates both the SHA and the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
